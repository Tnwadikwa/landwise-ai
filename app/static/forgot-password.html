<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Reset password | Landwise AI</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=f611a72" /><link rel="stylesheet" href="/style.css" /></head>
  <body class="auth-page">
    <main class="auth-shell">
      <div class="auth-topbar"><a class="brand" href="/">Landwise<span> AI</span></a><a class="back-link" href="/login.html">← Back to sign in</a></div>
      <section class="auth-panel">
        <div class="auth-heading"><p class="eyebrow">Account recovery</p><h1>Reset your password.</h1><p>Enter your account email and we will send a secure reset link if an account exists.</p></div>
        <form id="forgot-form"><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@company.com" /></label><button class="button button-primary" type="submit" id="forgot-submit">Send email <span>→</span></button></form>
        <div id="forgot-message" class="message" hidden></div>
        <p class="auth-footnote">For your security, we use the same response whether or not an account exists.</p>
      </section>
    </main>
    <script src="/forgot-password.js"></script>
  </body>
</html>
