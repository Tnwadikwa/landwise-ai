<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Choose a new password | Landwise AI</title><link rel="stylesheet" href="/style.css" /></head>
  <body class="auth-page">
    <main class="auth-shell">
      <div class="auth-topbar"><a class="brand" href="/">Landwise<span> AI</span></a><a class="back-link" href="/login.html">← Back to sign in</a></div>
      <section class="auth-panel">
        <div class="auth-heading"><p class="eyebrow">Account recovery</p><h1>Choose a new password.</h1><p>Use at least 8 characters. Your other active sessions will be signed out.</p></div>
        <form id="reset-form"><label>New password<div class="password-field"><input name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters" /><button type="button" id="toggle-reset-password" aria-label="Show password">Show</button></div></label><button class="button button-primary" type="submit" id="reset-submit">Reset password <span>→</span></button></form>
        <div id="reset-message" class="message" hidden></div>
      </section>
    </main>
    <script src="/reset-password.js"></script>
  </body>
</html>
