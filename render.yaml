services:
  - type: web
    name: landwise-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SITE_URL
        value: https://landwiseai.com
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: PAID_ACCOUNT_EMAILS
        sync: false
      - key: LOCATION_VALIDATION_ENABLED
        value: "true"
